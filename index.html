<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido de Água</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Nunito', sans-serif; }
    .wave-bg { background: linear-gradient(135deg, #0077b6, #00b4d8, #90e0ef); }
    .glass-card { background: rgba(255,255,255,.95); backdrop-filter: blur(10px); }
    .btn-primary { background: linear-gradient(135deg, #0077b6, #00b4d8); }
  </style>
</head>

<body class="h-full wave-bg py-8 px-4">
<div class="max-w-md mx-auto">

  <div class="text-center mb-6">
    <h1 class="text-3xl font-extrabold text-white">Água Mineral Camaçari</h1>
    <p class="text-white/90">Entrega rápida</p>
  </div>

  <div class="glass-card rounded-3xl shadow-2xl p-6">
    <form id="order-form" class="space-y-5">

      <input id="nome" required placeholder="Nome completo" class="w-full px-4 py-3 rounded-xl border-2">
      <input id="telefone" required placeholder="Telefone / WhatsApp" class="w-full px-4 py-3 rounded-xl border-2">

      <select id="bairro" required class="w-full px-4 py-3 rounded-xl border-2">
        <option value="">Selecione o bairro</option>
        <option>Parque Verde I</option><option>Parque Verde II</option>
        <option>Gleba E</option><option>Gleba C</option>
        <option>Gleba B</option><option>Gleba A</option>
        <option>Verde Horizonte</option><option>Ponto Certo</option>
        <option>Piaçaveira</option><option>Inocoop</option>
        <option>Novo Horizonte</option><option>Nova Vitória</option>
        <option>Alto da Cruz</option><option>Triângulo</option>
        <option>Phoc I</option><option>Phoc II</option><option>Phoc III</option>
        <option>Lama Preta</option><option>Gravatá</option>
        <option>Centro</option><option>Mangueiral</option>
        <option>Parque Satélite</option><option>Camaçari de dentro</option>
        <option>Jardim Brasilia</option><option>Burisatuba</option>
        <option>Dois de julho</option>
      </select>

      <input id="complemento" required placeholder="Rua / Nº / Referência"
             class="w-full px-4 py-3 rounded-xl border-2">

      <select id="marca" required class="w-full px-4 py-3 rounded-xl border-2">
        <option value="">Selecione a marca</option>
        <option value="Itagy">Itagy</option>
        <option value="davida">Fonte D'vida</option>
        <option value="Imbassaí">Imbassaí</option>
      </select>

      <p id="precosMarca" class="text-sm text-gray-600"></p>

      <div>
        <p class="font-semibold mb-2">Garrafão Completo</p>
        <div class="flex items-center gap-4">
          <button type="button" onclick="alterar('completo',-1)">−</button>
          <input id="qtdCompleto" value="0" readonly class="w-16 text-center border-2 rounded">
          <button type="button" onclick="alterar('completo',1)">+</button>
        </div>
      </div>

      <div>
        <p class="font-semibold mb-2">Garrafão Troca</p>
        <div class="flex items-center gap-4">
          <button type="button" onclick="alterar('troca',-1)">−</button>
          <input id="qtdTroca" value="0" readonly class="w-16 text-center border-2 rounded">
          <button type="button" onclick="alterar('troca',1)">+</button>
        </div>
      </div>

      <div id="validadeContainer" class="space-y-2"></div>

      <div class="bg-cyan-50 rounded-xl p-4 text-sm space-y-1">
        <div class="flex justify-between"><span>Subtotal</span><span>R$ <span id="subtotal">0,00</span></span></div>
        <div class="flex justify-between">
          <span>Taxa</span>
          <span class="font-bold text-red-600">R$ <span id="taxa">0,00</span></span>
        </div>
        <p id="taxaExtraMsg" class="hidden text-xs text-red-600 font-semibold">
          ⚠️ Pedido com 3 garrafões: taxa adicional de R$ 1,00
        </p>
        <div class="flex justify-between font-extrabold text-cyan-700 text-lg">
          <span>Total</span><span>R$ <span id="total">0,00</span></span>
        </div>
      </div>

      <select id="pagamento" required class="w-full px-4 py-3 rounded-xl border-2">
        <option value="">Forma de pagamento</option>
        <option value="PIX">Pix</option>
        <option value="DINHEIRO">Dinheiro</option>
        <option value="CARTAO">Cartão</option>
      </select>

      <div id="pixBox" class="hidden bg-green-50 p-3 rounded-xl text-sm">
        <strong>Chave Pix:</strong>
        <p class="font-bold select-all">71991167085</p>
      </div>

      <div id="dinheiroBox" class="hidden space-y-2">
        <label class="flex gap-2 text-sm">
          <input type="checkbox" id="precisaTroco"> Precisa de troco?
        </label>
        <input id="trocoPara" type="number" placeholder="Troco para quanto?"
               class="w-full px-4 py-3 rounded-xl border-2 hidden">
      </div>

      <div id="cartaoBox" class="hidden">
        <select id="tipoCartao" class="w-full px-4 py-3 rounded-xl border-2">
          <option value="">Débito ou Crédito</option>
          <option>Débito</option>
          <option>Crédito</option>
        </select>
      </div>

      <button class="btn-primary w-full py-4 rounded-xl text-white font-bold">
        Confirmar Pedido
      </button>

    </form>
  </div>
</div>

<script>
const TAXA_CARTAO = 0.05;

const marcas = {
  Itagy: { nome: "Itagy", completo: 28, troca: 8 },
  davida: { nome: "Fonte D'vida", completo: 32, troca: 10 },
  Imbassaí: { nome: "Imbassaí", completo: 32, troca: 10 }
};

const taxas = {
  "Parque Verde I":2,"Parque Verde II":2,"Gleba E":2,"Gleba C":2,
  "Gleba B":4,"Gleba A":4,"Verde Horizonte":2,"Ponto Certo":2,
  "Piaçaveira":2,"Inocoop":2,"Novo Horizonte":4,"Nova Vitória":4,
  "Alto da Cruz":2,"Triângulo":2,"Phoc I":2,"Phoc II":2,"Phoc III":2,
  "Lama Preta":2,"Gravatá":4,"Centro":2,"Mangueiral":4,
  "Parque Satélite":4,"Camaçari de dentro":2,"Jardim Brasilia":2,
  "Burisatuba":2,"Dois de julho":2
};

const anoAtual = new Date().getFullYear();
const anoMaximo = anoAtual + 3;

const qtdCompleto = document.getElementById('qtdCompleto');
const qtdTroca = document.getElementById('qtdTroca');
const validadeContainer = document.getElementById('validadeContainer');
const subtotalEl = document.getElementById('subtotal');
const taxaEl = document.getElementById('taxa');
const totalEl = document.getElementById('total');
const taxaExtraMsg = document.getElementById('taxaExtraMsg');
const marcaSelect = document.getElementById('marca');
const bairro = document.getElementById('bairro');
const pagamento = document.getElementById('pagamento');
const pixBox = document.getElementById('pixBox');
const dinheiroBox = document.getElementById('dinheiroBox');
const cartaoBox = document.getElementById('cartaoBox');
const precisaTroco = document.getElementById('precisaTroco');
const trocoPara = document.getElementById('trocoPara');
const tipoCartao = document.getElementById('tipoCartao');

function alterar(tipo, v){
  const totalAtual = Number(qtdCompleto.value) + Number(qtdTroca.value);
  if (v > 0 && totalAtual >= 3) return;

  const campo = tipo === 'completo' ? qtdCompleto : qtdTroca;
  campo.value = Math.max(0, Number(campo.value) + v);
  gerarCamposValidade();
  calcular();
}

function gerarCamposValidade(){
  validadeContainer.innerHTML = '';
  for(let i=1;i<=qtdTroca.value;i++){
    validadeContainer.innerHTML += `
      <input required type="number" min="${anoAtual}" max="${anoMaximo}"
      placeholder="Ano de validade do garrafão ${i}"
      class="w-full px-4 py-3 rounded-xl border-2 validade">
    `;
  }
}

function calcular(){
  if(!marcaSelect.value){
    subtotalEl.innerText = taxaEl.innerText = totalEl.innerText = '0,00';
    return;
  }

  const marca = marcas[marcaSelect.value];
  const subtotal =
    (qtdCompleto.value * marca.completo) +
    (qtdTroca.value * marca.troca);

  let taxaEntrega = taxas[bairro.value] || 0;

  const totalGarrafoes =
    Number(qtdCompleto.value) + Number(qtdTroca.value);

  if (totalGarrafoes === 3) {
    taxaEntrega += 1;
    taxaExtraMsg.classList.remove('hidden');
  } else {
    taxaExtraMsg.classList.add('hidden');
  }

  let total = subtotal + taxaEntrega;

  if(pagamento.value === 'CARTAO'){
    total += total * TAXA_CARTAO;
  }

  subtotalEl.innerText = subtotal.toFixed(2).replace('.', ',');
  taxaEl.innerText = taxaEntrega.toFixed(2).replace('.', ',');
  totalEl.innerText = total.toFixed(2).replace('.', ',');
}

marcaSelect.addEventListener('change', calcular);
bairro.addEventListener('change', calcular);
pagamento.addEventListener('change', () => {
  pixBox.classList.add('hidden');
  dinheiroBox.classList.add('hidden');
  cartaoBox.classList.add('hidden');

  if(pagamento.value === 'PIX') pixBox.classList.remove('hidden');
  if(pagamento.value === 'DINHEIRO') dinheiroBox.classList.remove('hidden');
  if(pagamento.value === 'CARTAO') cartaoBox.classList.remove('hidden');

  calcular();
});

precisaTroco.addEventListener('change', () => {
  trocoPara.classList.toggle('hidden', !precisaTroco.checked);
});
/* ENVIO WHATSAPP */
document.getElementById('order-form').addEventListener('submit', e => {
  e.preventDefault();

  if(pagamento.value === 'CARTAO' && !tipoCartao.value){
    alert('Selecione Débito ou Crédito');
    return;
  }

  if(pagamento.value === 'DINHEIRO' && precisaTroco.checked && !trocoPara.value){
    alert('Informe o valor do troco');
    return;
  }

  let anosTxt = '';
  document.querySelectorAll('.validade').forEach((c, i) => {
    anosTxt += `\n• Garrafão ${i+1}: ${c.value}`;
  });

  const marcaNome = marcas[marcaSelect.value].nome;

  const msg = `
NOVO PEDIDO
 ${nome.value}
 ${telefone.value}

 ${bairro.value}
${complemento.value}

Marca: ${marcaNome}

 Produtos:
• Completo: ${qtdCompleto.value}
• Troca: ${qtdTroca.value}
${anosTxt}

Total: R$ ${totalEl.innerText}
`;

  window.open(
    `https://wa.me/5571991167085?text=${encodeURIComponent(msg)}`,
    '_blank'
  );
});

</script>

</body>
</html>
